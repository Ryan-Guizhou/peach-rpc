peach:
  rpc:
    transport:
      security:
        mode: MTLS
        certificate-path: ${PEACH_RPC_TLS_CERT}
        private-key-path: ${PEACH_RPC_TLS_KEY}
        trust-certificate-path: ${PEACH_RPC_TLS_CA}
        hostname-verification: true
        reload-interval: 30s
        expiry-warning-threshold: 7d
