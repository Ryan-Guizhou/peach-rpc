spring:
  application:
    name: peach-rpc-example-provider

peach:
  rpc:
    registry:
      type: nacos
      endpoints: 127.0.0.1:8848
      namespace: public
      nacos:
        group: PEACH_RPC
        cluster: DEFAULT
    server:
      host: 0.0.0.0
      port: 19090
      advertised-host: 127.0.0.1
      advertised-port: 19090
      drain-timeout: 5s
      control-plane-timeout: 3s
