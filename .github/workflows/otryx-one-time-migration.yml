name: OTRYX One-Time Migration
on:
  push:
    branches: [refactor/otryx-2.0.0]
permissions:
  contents: write
jobs:
  migrate:
    if: contains(github.event.head_commit.message, 'bootstrap OTRYX one-time migration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Apply migration
        run: python3 scripts/migrate_to_otryx.py
      - name: Remove one-time workflow
        run: rm -f .github/workflows/otryx-one-time-migration.yml
      - name: Commit on dedicated refactor branch
        run: |
          git config user.name "otryx-migration"
          git config user.email "otryx-migration@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "refactor(otryx): migrate code, configs, docs and scripts"
            git push origin HEAD:refactor/otryx-2.0.0
          fi
