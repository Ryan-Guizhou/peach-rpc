name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      nacos:
        image: nacos/nacos-server:v3.2.4
        env:
          MODE: standalone
          NACOS_AUTH_ENABLE: "false"
          NACOS_AUTH_TOKEN: "UGVhY2hScGNDb250cm9sUGxhbmVTZWNyZXRLZXkxMjM0NTY3ODkwMTIzNDU2Nzg5MA=="
          NACOS_AUTH_IDENTITY_KEY: peach-rpc-ci
          NACOS_AUTH_IDENTITY_VALUE: peach-rpc-ci-secret
        ports:
          - 8848:8848
          - 9848:9848
    env:
      NACOS_TEST_ENDPOINT: 127.0.0.1:8848
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Wait for Nacos
        shell: bash
        run: |
          for attempt in {1..60}; do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/8848' 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Nacos did not open port 8848 in time"
          exit 1

      - name: Repository checks
        run: python3 scripts/check_project.py

      - name: Verify Maven reactor
        run: mvn -B -ntp clean verify -Pquality

      - name: Verify V2-D.2 benchmark harness
        run: bash scripts/run_v2d2_benchmark_matrix.sh smoke target/v2d2-matrix-smoke

      - name: Verify 10k virtual-thread soak harness
        env:
          PEACH_RPC_SOAK_CONCURRENCY: "10000"
          PEACH_RPC_SOAK_PAYLOAD_SIZE: "64"
          PEACH_RPC_SOAK_CONNECTIONS: "4"
          PEACH_RPC_SOAK_WARMUP_SECONDS: "1"
          PEACH_RPC_SOAK_DURATION_SECONDS: "3"
          PEACH_RPC_SOAK_CLIENT_TIMEOUT_MS: "15000"
          PEACH_RPC_SOAK_OUTPUT: "target/v2d2-soak-smoke.json"
        run: bash scripts/run_v2d2_soak.sh

      - name: Upload V2-D.2 smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2d2-smoke-evidence-${{ github.run_id }}
          path: |
            target/v2d2-matrix-smoke
            target/v2d2-soak-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify independent JVM examples
        run: bash scripts/run_example_process_e2e.sh
