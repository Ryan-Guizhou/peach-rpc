name: Rolling Compatibility

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Baseline Git ref used as version N
        required: true
        default: main
        type: string
  pull_request:
    paths:
      - 'peach-rpc-core/**'
      - 'peach-rpc-codec-fory/**'
      - 'peach-rpc-registry-*/**'
      - 'peach-rpc-examples/**'
      - 'scripts/run_rolling_compatibility_e2e.sh'
      - '.github/workflows/rolling-compatibility.yml'

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      nacos:
        image: nacos/nacos-server:v3.2.4
        env:
          MODE: standalone
          NACOS_AUTH_ENABLE: "false"
          NACOS_AUTH_TOKEN: "UGVhY2hScGNDb250cm9sUGxhbmVTZWNyZXRLZXkxMjM0NTY3ODkwMTIzNDU2Nzg5MA=="
          NACOS_AUTH_IDENTITY_KEY: peach-rpc-ci
          NACOS_AUTH_IDENTITY_VALUE: peach-rpc-ci-secret
        ports:
          - 8848:8848
          - 9848:9848
    env:
      NACOS_TEST_ENDPOINT: 127.0.0.1:8848
      BASELINE_REF: ${{ github.event.pull_request.base.sha || inputs.baseline_ref || 'main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Wait for Nacos
        shell: bash
        run: |
          for attempt in {1..90}; do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/8848' 2>/dev/null               && timeout 1 bash -c '</dev/tcp/127.0.0.1/9848' 2>/dev/null; then
              sleep 25
              exit 0
            fi
            sleep 2
          done
          echo "Nacos did not become ready in time"
          exit 1

      - name: Prepare version N worktree
        shell: bash
        run: |
          git fetch origin "$BASELINE_REF" --depth=1 || true
          git worktree add target/compat-n "$BASELINE_REF"

      - name: Build version N examples
        working-directory: target/compat-n
        run: >
          mvn -B -ntp
          -pl peach-rpc-examples
          -am
          package
          -DskipTests

      - name: Build version N+1 examples
        run: >
          mvn -B -ntp
          -pl peach-rpc-examples
          -am
          package
          -DskipTests

      - name: Verify N/N+1 and rollback compatibility
        run: >
          bash scripts/run_rolling_compatibility_e2e.sh
          "$PWD/target/compat-n"
          "$PWD"
