<rect x="250" y="125" width="170" height="98" rx="16" fill="#DDF7F4" stroke="#16A5B0" stroke-width="2"/><text x="335" y="164" font-size="18" fill="#153451">Local Directory</text><text x="335" y="189" font-size="15" fill="#36677A">P2C / EWMA</text>
<rect x="465" y="125" width="170" height="98" rx="16" fill="#DDF7F4" stroke="#16A5B0" stroke-width="2"/><text x="550" y="164" font-size="18" fill="#153451">Fory encode</text><text x="550" y="189" font-size="15" fill="#36677A">Wire v1</text>
<rect x="680" y="125" width="170" height="98" rx="16" fill="#153451"/><text x="765" y="164" font-size="19" fill="white">Vert.x TCP</text><text x="765" y="189" font-size="15" fill="#9EEDE9">TLS / mTLS</text>
