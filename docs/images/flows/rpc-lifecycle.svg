<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1310 400" role="img" aria-label="OTRYX RPC unary call lifecycle"><defs><style>.title{font:700 31px Arial,Helvetica,sans-serif;fill:#153451}.section{font:700 20px Arial,Helvetica,sans-serif;fill:#153451}.body{font:16px Arial,Helvetica,sans-serif;fill:#234960}.muted{font:13px Arial,Helvetica,sans-serif;fill:#517186}.label{font:700 16px Arial,Helvetica,sans-serif;fill:#153451}</style><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L10 3 L0 6Z" fill="#16A5B0"/></marker><marker id="dim" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L10 3 L0 6Z" fill="#6B8B9B"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F7FCFF"/><stop offset="1" stop-color="#E8F7F7"/></linearGradient></defs>
<rect width="1310" height="400" rx="24" fill="url(#bg)"/><text x="36" y="52" class="title">OTRYX  ·  Unary RPC lifecycle</text><text x="37" y="79" class="muted">Control plane and dynamic extension discovery are not on the individual request hot path</text>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
