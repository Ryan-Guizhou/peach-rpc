# Generated by scripts/sync_agent_mcp.py from .agents/config/agent-mcp.json.
# Do not edit directly. Secrets come from the client environment.
# MySQL is disabled until separately authorized and DB-grant verified.

[mcp_servers."mysql"]
command = "cmd"
args = ["/c", "npx", "-y", "mcp-server-mysql@latest"]
enabled = false
required = false
startup_timeout_sec = 60
tool_timeout_sec = 60
env_vars = ["MYSQL_HOST", "MYSQL_PORT", "MYSQL_USER", "MYSQL_PASS", "MYSQL_DB"]

[mcp_servers."github"]
command = "cmd"
args = ["/c", "npx", "-y", "@modelcontextprotocol/server-github"]
enabled = true
required = false
startup_timeout_sec = 60
tool_timeout_sec = 60
env_vars = ["GITHUB_PERSONAL_ACCESS_TOKEN"]

[mcp_servers."context7"]
command = "cmd"
args = ["/c", "npx", "-y", "@upstash/context7-mcp@latest"]
enabled = true
required = false
startup_timeout_sec = 60
tool_timeout_sec = 60
env_vars = ["CONTEXT7_API_KEY"]

[mcp_servers."codegraph"]
command = "cmd"
args = ["/c", "npx", "-y", "@colbymchenry/codegraph", "serve", "--mcp", "--path", "."]
enabled = true
required = false
startup_timeout_sec = 60
tool_timeout_sec = 60

[mcp_servers."agentmemory"]
command = "cmd"
args = ["/c", "npx", "-y", "@agentmemory/mcp"]
enabled = true
required = false
startup_timeout_sec = 60
tool_timeout_sec = 60
env_vars = ["AGENTMEMORY_SECRET"]

[mcp_servers."agentmemory".env]
"AGENTMEMORY_URL" = "http://localhost:3111"
"AGENTMEMORY_TOOLS" = "core"
